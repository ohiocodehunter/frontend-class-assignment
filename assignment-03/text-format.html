<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 2rem;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.7;
        }
        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        strong {
            color: #0f172a;
            font-weight: 700;
        }
        em {
            color: #0369a1;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Text Formatting Demonstration</h2>
        <p>Web development requires attention to semantic markup.<br>Using the right elements improves accessibility and clarity.</p>
        <p>It is <strong>essential</strong> to practice semantic markup because it provides <em>meaningful</em> context to user agents and screen readers.</p>
    </div>
</body>
</html>
