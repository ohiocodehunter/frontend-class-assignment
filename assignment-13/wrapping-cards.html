<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Shop</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #0f172a;
            font-size: 2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
        }
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 1.5rem;
            flex: 1 1 200px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .card p {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #059669;
        }
        .card p::before {
            content: "₹";
            font-size: 1rem;
            margin-right: 2px;
        }
    </style>
</head>
<body>
    <h1>Stationery Shop</h1>
    <div class="cards-row">
        <div class="card">
            <h3>Notebook</h3>
            <p>60</p>
        </div>
        <div class="card">
            <h3>Pen</h3>
            <p>15</p>
        </div>
        <div class="card">
            <h3>Bag</h3>
            <p>350</p>
        </div>
        <div class="card">
            <h3>Book</h3>
            <p>120</p>
        </div>
    </div>
</body>
</html>
