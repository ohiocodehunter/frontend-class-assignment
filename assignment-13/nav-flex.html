<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation Bar</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }
        nav {
            display: flex;
            background-color: #0f172a;
            padding: 1rem 2rem;
            gap: 2rem;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            transition: color 0.2s ease;
        }
        nav a:hover {
            color: #38bdf8;
        }
        .content {
            padding: 3rem 2rem;
            max-width: 700px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
    </nav>
    <div class="content">
        <h2>Flexbox Navigation Bar</h2>
        <p>This navigation bar uses <code>display: flex</code> with a dark background (<code>#0f172a</code>) and pure white links (<code>#ffffff</code>) aligned horizontally.</p>
    </div>
</body>
</html>
