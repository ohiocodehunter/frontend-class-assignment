<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Image</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 650px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
            font-size: 2rem;
        }
        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px solid #e2e8f0;
            margin: 1rem auto;
            display: block;
        }
        .caption {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My Workspace Profile</h1>
        <img src="images/sample.jpg" alt="A student workspace showing a laptop, study materials, and notebook on a desk" width="200" height="200">
        <p class="caption">Profile snapshot displayed at 200 &times; 200 pixels.</p>
    </div>
</body>
</html>
