<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Internal CSS</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8fafc;
        }
        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: navy;
            margin-top: 0;
        }
        .highlight {
            background-color: yellow;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internal and Inline Styling Demonstration</h1>
        <p style="color: red;">This paragraph is styled using an inline style rule (color: red).</p>
        <p class="highlight">This paragraph is styled using an internal stylesheet class selector (.highlight with yellow background).</p>
    </div>
</body>
</html>
