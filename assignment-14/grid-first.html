<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Equal Columns</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 700px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .box {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 700;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, background-color 0.2s;
        }
        .box:hover {
            transform: scale(1.03);
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h2>CSS Grid: 3 Equal Columns (1fr 1fr 1fr)</h2>
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
