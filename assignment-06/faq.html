<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequently Asked Questions</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        dl {
            margin: 1.5rem 0 0 0;
        }
        dt {
            font-weight: 700;
            color: #1e40af;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
        dd {
            margin-left: 0;
            margin-top: 0.35rem;
            color: #475569;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Library FAQ</h1>
        <dl>
            <dt>How many books can I borrow?</dt>
            <dd>Undergraduate students can borrow up to four books simultaneously for a duration of 14 days.</dd>
            <dt>Is the library open on Sunday?</dt>
            <dd>Yes, the library remains open on Sundays from 9:00 AM to 5:00 PM for reading room access.</dd>
        </dl>
    </div>
</body>
</html>
