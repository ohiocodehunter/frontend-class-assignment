<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Menu</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        ol {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #334155;
            padding-left: 1.5rem;
        }
        ol ol {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Canteen Menu</h1>
        <ol>
            <li>Samosa</li>
            <li>Sandwich
                <ol>
                    <li>Cheese</li>
                    <li>Vegetable</li>
                </ol>
            </li>
        </ol>
    </div>
</body>
</html>
