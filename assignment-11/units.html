<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units Demonstration</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 700px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .fixed-box {
            width: 200px;
            height: 40px;
            background-color: #3b82f6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .percentage-box {
            width: 50%;
            height: 40px;
            background-color: #10b981;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        p {
            font-size: 1.5rem;
            color: #334155;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>CSS Units (px, %, rem)</h2>
        <div class="fixed-box">200px &times; 40px Box</div>
        <div class="percentage-box">50% Width &times; 40px Box</div>
        <p>This paragraph text is styled with a relative unit of 1.5rem.</p>
    </div>
</body>
</html>
