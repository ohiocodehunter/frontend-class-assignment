<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 12px;
            padding: 16px;
            max-width: 360px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .card h3 {
            color: #166534;
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 1.3rem;
        }
        .card p {
            color: #374151;
            margin: 0;
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Web Design Essentials</h3>
        <p>Cards are flexible UI components used to present cohesive information with distinct padding, background shading, and borders.</p>
    </div>
</body>
</html>
