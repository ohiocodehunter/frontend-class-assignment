<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 2.5rem;
            max-width: 650px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
        }
        .box {
            width: 200px;
            padding: 20px;
            border: 5px solid #2563eb;
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-weight: 600;
        }
        .content-box {
            box-sizing: content-box;
            background-color: #3b82f6;
        }
        .border-box {
            box-sizing: border-box;
            background-color: #10b981;
            border-color: #059669;
        }
        .note {
            font-size: 0.95rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Box Model: content-box vs border-box</h2>
        <div class="box content-box">
            box-sizing: content-box
            <p class="note" style="color: white; margin: 0.5rem 0 0;">Total rendered width: 250px (200 + 40 + 10)</p>
        </div>
        <div class="box border-box">
            box-sizing: border-box
            <p class="note" style="color: white; margin: 0.5rem 0 0;">Total rendered width: exactly 200px</p>
        </div>
    </div>
</body>
</html>
