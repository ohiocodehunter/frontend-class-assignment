<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
        }
        #profile {
            background-color: #ffffff;
            border-left: 4px solid #3b82f6;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="profile">
        <h2>User Profile</h2>
        <p data-topic="hobbies">In my free time, I enjoy reading technology blogs, competitive programming, and playing chess with friends.</p>
    </div>
</body>
</html>
