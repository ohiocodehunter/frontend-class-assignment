<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Layout</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 2rem;
            color: #1e293b;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 1.5rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .main {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            line-height: 1.6;
        }
        .footer {
            background-color: #334155;
            color: #e2e8f0;
            padding: 1.25rem 2rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header Block: Welcome to Student Portal</div>
        <div class="main">
            <h3>Main Content Area</h3>
            <p>This is the primary content block grouped using div elements. In HTML, div elements serve as generic containers to divide sections and apply consistent layout and styling rules.</p>
        </div>
        <div class="footer">Footer Block: &copy; 2026 Invertis University Lab Assignment</div>
    </div>
</body>
</html>
